---
# disk_cleanup.yml
# General Linux disk reclamation — works across major distros.
# Auto-detects the package manager (apt / dnf / yum / pacman) via ansible_os_family.
#
#   ansible-playbook -i inventory disk_cleanup.yml                    # run on all hosts
#   ansible-playbook -i inventory disk_cleanup.yml -l <host>          # one host
#   ansible-playbook -i inventory disk_cleanup.yml --check            # dry run
#   ansible-playbook -i inventory disk_cleanup.yml --tags docker      # docker parts only
#   ansible-playbook -i inventory disk_cleanup.yml -e prune_docker_volumes=true

- name: Reclaim disk space (general Linux)
  hosts: all
  become: true
  gather_facts: true   # needed for ansible_os_family / ansible_date_time

  vars:
    cleanup_target: "/"                 # filesystem to report on
    journal_vacuum_size: "100M"         # journald cap
    prune_all_images: true              # docker image prune -a
    prune_docker_volumes: false         # keep OFF on production
    containerd_prune: false             # opt-in; only if you use containerd directly
    containerd_namespace: moby
    tmp_cleanup: false                  # opt-in: delete old files from /tmp and /var/tmp
    tmp_min_age_days: 7
    cleanup_log: /var/log/ansible-disk-cleanup.log

  tasks:
    # ---------- detect package manager ----------
    - name: Detect package manager from distro family
      ansible.builtin.set_fact:
        package_module: "{{ item.1 }}"
      loop:
        - [ "{{ ansible_os_family == 'Debian' }}", "apt" ]
        - [ "{{ ansible_os_family in ['RedHat', 'Fedora'] }}", "dnf" ]
        - [ "{{ ansible_os_family == 'Arch' }}", "pacman" ]
      when: item.0
      loop_control:
        label: item.1

    # ---------- report: BEFORE ----------
    - name: Record disk usage before
      ansible.builtin.command: "df -h {{ cleanup_target }}"
      register: df_before
      changed_when: false

    - name: Show disk usage before
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} — BEFORE\n{{ df_before.stdout }}"

    # ---------- package manager ----------
    - name: APT — autoremove, purge, clean cache
      ansible.builtin.apt:
        autoremove: true
        purge: true
        clean: true
      when: package_module == 'apt'
      tags: [system]

    - name: DNF — autoremove and clean cache
      ansible.builtin.dnf:
        autoremove: true
        clean: metadata
      when: package_module == 'dnf'
      tags: [system]

    - name: Pacman — remove orphaned packages
      community.general.pacman:
        cleanup: true
      when: package_module == 'pacman'
      tags: [system]

    - name: Pacman — clean package cache
      ansible.builtin.file:
        path: /var/cache/pacman/pkg
        state: absent
      when: package_module == 'pacman'
      tags: [system]

    # ---------- systemd-journald ----------
    - name: Vacuum journald logs to {{ journal_vacuum_size }}
      ansible.builtin.command: "journalctl --vacuum-size={{ journal_vacuum_size }}"
      register: journal_vacuum
      changed_when: false
      tags: [system]

    # ---------- Docker ----------
    - name: Check if docker is installed
      ansible.builtin.command: docker --version
      register: docker_check
      failed_when: false
      changed_when: false

    - name: Prune unused Docker images
      ansible.builtin.command: >-
        docker image prune {{ '-a' if prune_all_images }} -f
      when: docker_check.rc == 0
      register: docker_img_prune
      failed_when: false
      changed_when: >-
        docker_img_prune.rc == 0
        and 'Total reclaimed space: 0B' not in docker_img_prune.stdout
      tags: [docker]

    - name: Prune stopped Docker containers, networks, and build cache
      ansible.builtin.command: >-
        docker system prune -f {{ ' --volumes' if prune_docker_volumes }}
      when: docker_check.rc == 0
      register: docker_sys_prune
      failed_when: false
      changed_when: >-
        docker_sys_prune.rc == 0
        and (docker_sys_prune.stdout | default('') | length > 0)
      tags: [docker]

    # ---------- containerd (opt-in) ----------
    - name: Prune containerd images
      ansible.builtin.command: "ctr -n {{ containerd_namespace }} images prune"
      when: containerd_prune
      register: containerd_prune_result
      failed_when: false
      changed_when: >-
        containerd_prune_result.rc == 0
        and (containerd_prune_result.stdout | default('') | length > 0)
      tags: [containerd]

    # ---------- tmp cleanup (opt-in) ----------
    - name: Remove files older than {{ tmp_min_age_days }} days from /tmp and /var/tmp
      ansible.builtin.command: "find /tmp /var/tmp -type f -mtime +{{ tmp_min_age_days }} -delete"
      when: tmp_cleanup
      register: tmp_prune
      changed_when: false
      tags: [tmp]

    # ---------- report: AFTER + summary ----------
    - name: Record disk usage after
      ansible.builtin.command: "df -h {{ cleanup_target }}"
      register: df_after
      changed_when: false

    - name: Show cleanup summary
      ansible.builtin.debug:
        msg:
          - "Docker image prune : {{ docker_img_prune.stdout | default('(no docker)') | trim }}"
          - "Docker system prune: {{ docker_sys_prune.stdout_lines | default([]) | join(' | ') | trim }}"
          - "containerd prune   : {{ 'rc=' ~ containerd_prune_result.rc if containerd_prune else 'skipped' }}"
          - "journald vacuum    : rc={{ journal_vacuum.rc }}"
          - ""
          - "BEFORE\n{{ df_before.stdout }}"
          - "AFTER\n{{ df_after.stdout }}"

    - name: Append summary to log file
      ansible.builtin.command: >-
        sh -c
        'printf "==== %s @ %s ====\nBEFORE: %s\nAFTER:  %s\ndocker_img: %s\ndocker_sys: %s\n\n"
        "{{ inventory_hostname }}" "{{ ansible_date_time.iso8601 }}"
        "{{ df_before.stdout_lines[-1] }}" "{{ df_after.stdout_lines[-1] }}"
        "{{ docker_img_prune.stdout | default('') }}"
        "{{ docker_sys_prune.stdout | default('') }}"
        >> {{ cleanup_log }}'
      when: not ansible_check_mode
      changed_when: false
