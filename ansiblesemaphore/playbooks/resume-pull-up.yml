---
# One-shot: refresh the resume.local stack (pull current image, compose up, show logs)
- name: resume pull and up
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Show existing compose projects and resume containers
      ansible.builtin.shell: |
        set +e
        echo '== docker compose ls =='
        docker compose ls -a
        echo '== containers matching resume =='
        docker ps -a | grep -i resume
        echo '== docker images matching resume =='
        docker images | grep -i resume
      args:
        executable: /bin/bash
      register: pre
      changed_when: false

    - name: Report current state
      ansible.builtin.debug:
        var: pre.stdout_lines

    - name: Locate resume compose file
      ansible.builtin.shell: |
        set +e
        find /opt /srv /root /home -maxdepth 4 \( -name 'docker-compose*.yml' -o -name 'docker-compose*.yaml' -o -name 'compose.yml' -o -name 'compose.yaml' \) 2>/dev/null
      args:
        executable: /bin/bash
      register: found
      changed_when: false

    - name: Show candidates
      ansible.builtin.debug:
        var: found.stdout_lines

    - name: Choose compose file (path contains resume, else content match)
      ansible.builtin.set_fact:
        cf: "{{ (found.stdout_lines | select('search', '(?i)resume') | list | first) if (found.stdout_lines | select('search', '(?i)resume') | list | length > 0) else (found.stdout_lines | first | default('')) }}"

    - name: Report chosen file
      ansible.builtin.debug:
        msg: "using {{ cf }}"

    - name: Pull current images
      ansible.builtin.command: "docker compose -f {{ cf }} pull"
      register: pulled
      when: cf | length > 0

    - name: Show pull output
      ansible.builtin.debug:
        var: pulled.stdout_lines

    - name: Compose up
      ansible.builtin.command: "docker compose -f {{ cf }} up -d"
      register: upped
      when: cf | length > 0

    - name: Show up output
      ansible.builtin.debug:
        var: upped.stdout_lines

    - name: Collect logs after startup
      ansible.builtin.shell: sleep 8; docker compose -f {{ cf }} logs --no-color --tail=80
      args:
        executable: /bin/bash
      register: logs
      changed_when: false
      when: cf | length > 0

    - name: Show logs
      ansible.builtin.debug:
        var: logs.stdout_lines

    - name: Final status
      ansible.builtin.command: "docker compose -f {{ cf }} ps"
      register: psout
      when: cf | length > 0

    - name: Show final status
      ansible.builtin.debug:
        var: psout.stdout_lines
