---
- name: Omni cert refresh via lan fetch
  hosts: omni.local
  become: true
  vars:
    fetch_base: http://10.0.0.18:18323/1e23d2591fddbe2b
  tasks:
    - name: fetch omni cert
      get_url:
        url: "{{ fetch_base }}/fullchain.pem"
        dest: /home/romeo/omni/fullchain.pem
        owner: romeo
        group: romeo
        mode: "0644"
    - name: fetch omni key
      get_url:
        url: "{{ fetch_base }}/priv.key"
        dest: /home/romeo/omni/priv.key
        owner: romeo
        group: romeo
        mode: "0600"
    - name: fetch gw cert
      get_url:
        url: "{{ fetch_base }}/gw-fullchain.pem"
        dest: /home/romeo/omni/gw-fullchain.pem
        owner: romeo
        group: romeo
        mode: "0644"
    - name: fetch gw key
      get_url:
        url: "{{ fetch_base }}/gw-priv.key"
        dest: /home/romeo/omni/gw-priv.key
        owner: romeo
        group: romeo
        mode: "0600"
    - name: guard compose patch
      shell: grep -c gw-fullchain /home/romeo/omni/compose.yaml
      register: g
      changed_when: false
    - name: patch compose machine-api cert paths and mounts
      shell: |
        cd /home/romeo/omni
        sed -i 's|--machine-api-cert=/etc/omni/tls/fullchain.pem|--machine-api-cert=/etc/omni/tls/gw-fullchain.pem|' compose.yaml
        sed -i 's|--machine-api-key=/etc/omni/tls/priv.key|--machine-api-key=/etc/omni/tls/gw-priv.key|' compose.yaml
        sed -i 's|      - ./fullchain.pem:/etc/omni/tls/fullchain.pem:ro|      - ./fullchain.pem:/etc/omni/tls/fullchain.pem:ro\n      - ./gw-fullchain.pem:/etc/omni/tls/gw-fullchain.pem:ro\n      - ./gw-priv.key:/etc/omni/tls/gw-priv.key:ro|' compose.yaml
      when: g.stdout | int == 0
    - name: open 8095 in ufw
      shell: ufw allow 8095/tcp comment 'omni kube proxy' >/dev/null; ufw status | grep -E "8095|8090|443"
    - name: restart omni
      shell: cd /home/romeo/omni && docker compose up -d omni && sleep 15 && docker ps --format table | grep omni
    - name: verify certs
      shell: |
        for p in 443 8090 8095; do
          echo "port $p:"
          echo | timeout 8 openssl s_client -connect 127.0.0.1:$p 2>/dev/null | openssl x509 -noout -subject -enddate 2>/dev/null || echo NOCERT
        done
      register: v1
      changed_when: false
    - name: show verify
      debug: var=v1.stdout_lines
    - name: container health
      shell: docker logs --tail 8 omni 2>&1 | cut -c1-160
      register: v2
      changed_when: false
    - name: show health
      debug: var=v2.stdout_lines
