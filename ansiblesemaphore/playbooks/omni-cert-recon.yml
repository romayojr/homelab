---
- name: Omni cert recon 2
  hosts: omni.local
  become: true
  tasks:
    - name: omni dir listing
      shell: ls -la /home/romeo/omni/
      changed_when: false
    - name: compose volumes and flags
      shell: grep -E "volumes|tls|cert|key|proxy|image:|command" /home/romeo/omni/compose.yaml
      changed_when: false
    - name: container mounts
      shell: docker inspect omni --format raw | tr ',' '\n' | grep -iE 'tls|Source' | head -20
      changed_when: false
    - name: certbot presence and certs
      shell: which certbot && certbot certificates 2>&1 | grep -E "Certificate Name|Expiry Date|Domains" || echo NO-CERTBOT
      changed_when: false
