---
# One-shot: deploy the WuTang homelab docs map (GitLab proj 11,
# romeo/homelab-architecture-diagrams) on this host (SportsDashboards LXC,
# 10.0.0.59) with docker compose on port 3245. Run against the pinned
# one-shot inventory (single host), never a shared inventory.
# Token provenance: reuses the existing authenticated go-hawks remote URL
# on this host — no new secret is stored anywhere.
- name: deploy-chimera-docs
  hosts: all
  become: true
  vars:
    chimera_dir: /opt/chimera-docs
    expected_token_sha256: 98119c11d7a1bede901a422244a83d353687d9ee72f1b35604be3bd030eb8c3c
  tasks:
    - name: Verify GITLAB_TOKEN arrived intact from the Semaphore environment
      ansible.builtin.shell: printf %s "{{ GITLAB_TOKEN }}" | sha256sum | cut -d' ' -f1
      register: tok_hash
      changed_when: false
      no_log: true

    - name: Assert token integrity
      ansible.builtin.assert:
        that: tok_hash.stdout == expected_token_sha256
        fail_msg: "GITLAB_TOKEN mismatch (got sha {{ tok_hash.stdout[0:12] }}..., expected {{ expected_token_sha256[0:12] }}...)"

    - name: Clone docs repo (authenticated)
      ansible.builtin.git:
        repo: "https://oauth2:{{ GITLAB_TOKEN }}@gitlab.romeobagay.com/romeo/homelab-architecture-diagrams.git"
        dest: "{{ chimera_dir }}"
        version: main
        force: true
      environment:
        GIT_TERMINAL_PROMPT: "0"
      no_log: true

    - name: Assemble served site (git files + CI render artifacts, fail-closed)
      ansible.builtin.command: bash "{{ chimera_dir }}/deploy/sync.sh"
      environment:
        GITLAB_TOKEN: "{{ GITLAB_TOKEN }}"
      register: site_sync
      changed_when: true

    - name: Detect docker compose v2
      ansible.builtin.command: docker compose version
      register: compose_v2
      changed_when: false
      failed_when: false

    - name: Start nginx container (port 3245)
      ansible.builtin.command: >-
        {{ 'docker compose' if compose_v2.rc == 0 else 'docker-compose' }}
        -f deploy/docker-compose.yml up -d
      args:
        chdir: "{{ chimera_dir }}"

    - name: Keep the site fresh (pull main + artifacts every 30 min)
      ansible.builtin.cron:
        name: chimera-docs-sync
        minute: "*/30"
        job: "bash {{ chimera_dir }}/deploy/sync.sh >> {{ chimera_dir }}/sync.log 2>&1"

    - name: Wait for the interactive map
      ansible.builtin.uri:
        url: http://127.0.0.1:3245/
        status_code: 200
      register: probe
      retries: 15
      delay: 2
      until: probe.status == 200

    - name: Architecture artifacts are served
      ansible.builtin.uri:
        url: http://127.0.0.1:3245/architecture/diagram.svg
        status_code: 200

    - name: Sync output
      ansible.builtin.debug:
        var: site_sync.stdout_lines
